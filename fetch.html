<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table{
        width:80%;
        margin:auto;
        padding: 10px;
        font-size: 25px;
        color:black;
        border:2px solid black;
    }
</style>
<body>
    <table>
        <thead>
            <tr>
                <th>S.no</th>
                <th>title</th>
                <th>image</th>
                <th>category</th>
                <th>price</th>
            </tr>
        </thead>
        <tbody id = "data">
        </tbody>
    </table>

    <script>
        const ele = document.getElementById("data");
        const URL = "https://dummyjson.com/products";
        async function loadData(){
          try{
              const res = await fetch(URL); // json se string mein convert hogya hai // 
              const data = await res.json();
              console.log("data",data.products);
              let row = "";
              data.products.map((i,index)=>{
                row += `
                <tr>
                    <td>${index+1}</td>
                    <td>${i.title}</td>
                    <td><img src = "${i.images[0]}" width="100"></td>
                    <td>${i.category}</td>
                    <td>${i.price}</td>
                </tr>
                `;    // literal in html to add numeric value in a string // 
                ele.innerHTML = row;
              })
              <!-- ele.innerHTML = row; -->
          }
          catch (err){
               console.log("ERROR",err);
          }
        }
        loadData();
    </script>
</body>
</html>
