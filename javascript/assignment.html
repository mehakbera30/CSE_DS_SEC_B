<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #box {
            width: 500px;
            height: 250px;
            border: 5px solid black;
            margin: 50px auto;
            text-align: center;
            background-color: aqua;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div id="box">
    <script>
        var z = prompt("enter your product");
        var x = prompt("enter your quantity");
        const product = {
            tea:120,
            rice:120,
            coffee:150,
            sugar:700
        }
        document.write("your product is : " + z + "<br>");
        document.write("your quantity is : " + x + "<br>");
        document.write(" your total price is : " + x * product[z]);
    </script>
    </div>
</body>
</html>
